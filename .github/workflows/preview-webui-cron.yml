name: WebUI Cron Preview

on:
  push:
    branches:
      - feat/webui-cron-management
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "ROADMAP.md"
      - "CONTRIBUTING.md"
  workflow_dispatch:

permissions:
  contents: read

# Cancel any in-flight preview build for this branch when a new commit lands.
concurrency:
  group: preview-webui-cron-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build & Publish Preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          DATE=$(date -u +%Y%m%d)
          SHA=$(git rev-parse --short=8 HEAD)
          BASE_VERSION=$(git describe --tags --match "v*" --exclude "*nightly*" --exclude "*preview*" --abbrev=0 2>/dev/null || true)
          if [ -z "$BASE_VERSION" ] || [ "$BASE_VERSION" = "v0.0.0" ]; then
            VERSION="v0.0.0-cron-preview.${DATE}.${SHA}"
          else
            VERSION="${BASE_VERSION}-cron-preview.${DATE}.${SHA}"
          fi

          COMPARE_URL="https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}"
          if [ -n "$BASE_VERSION" ] && [ "$BASE_VERSION" != "v0.0.0" ]; then
            COMPARE_URL="https://github.com/${{ github.repository }}/compare/${BASE_VERSION}...${{ github.ref_name }}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "changelog=**Full Changelog**: $COMPARE_URL" >> "$GITHUB_OUTPUT"

      - name: Setup Go from go.mod
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml

      - name: Install zip
        run: sudo apt-get install -y zip

      - name: Create local tag for GoReleaser
        run: git tag "${{ steps.version.outputs.version }}"

      - name: Run GoReleaser (skip docker & notarize)
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ~> v2
          args: release --clean --skip=docker --skip=notarize
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GOVERSION: ${{ steps.setup-go.outputs.go-version }}
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.version }}
          INCLUDE_ANDROID_BUNDLE: "true"
          # NIGHTLY_BUILD reuses goreleaser's release.disable gate so we can
          # publish the GitHub Release ourselves below with rolling tag + notes.
          NIGHTLY_BUILD: "true"

      - name: Update preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIEW_TAG: webui-cron-preview
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          CHANGELOG='${{ steps.version.outputs.changelog }}'
          NOTES=$(cat <<EOF
          WebUI Cron Management preview build for **${VERSION}**

          Source branch: \`${BRANCH}\` @ \`$(git rev-parse --short HEAD)\`

          This is an automated preview build of the **feat/webui-cron-management** branch.
          It is NOT for production use and may be unstable.

          ${CHANGELOG}
          EOF
          )

          # Drop existing preview release and tag (rolling tag, always overwritten).
          gh release delete "$PREVIEW_TAG" --cleanup-tag -y 2>/dev/null || true

          # Force-update preview tag to the current commit.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa "$PREVIEW_TAG" -m "WebUI Cron preview ${VERSION}"
          git push origin "$PREVIEW_TAG" --force

          # Collect release artifacts produced by GoReleaser.
          ASSETS=()
          for f in dist/*.tar.gz dist/*.zip dist/*.deb dist/*.rpm dist/checksums.txt build/picoclaw-android-universal.zip; do
            [ -f "$f" ] && ASSETS+=("$f")
          done

          # Create preview release: prerelease, NOT marked latest.
          gh release create "$PREVIEW_TAG" \
            --title "WebUI Cron Management Preview" \
            --notes "$NOTES" \
            --target "$COMMIT_SHA" \
            --prerelease \
            --latest=false \
            "${ASSETS[@]}"
